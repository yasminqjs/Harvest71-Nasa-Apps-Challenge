name: ingest-data

# Baixa os dados essenciais (DSSAT, NASA POWER, SoilGrids) e grava no bucket privado.
# Roda no runner do GitHub, que tem internet aberta; autentica por Workload Identity
# Federation (sem chave). Dispara quando a main muda em data/ ou manualmente.
on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - ".github/workflows/ingest-data.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ingest-data
  cancel-in-progress: false

env:
  WIF_PROVIDER: projects/475766990512/locations/global/workloadIdentityPools/github/providers/github-oidc
  INGEST_SA: fieldshift-ingest-sa@fieldshift-harvest71-2026.iam.gserviceaccount.com
  BUCKET: fieldshift-data-fieldshift-harvest71-2026

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.INGEST_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Coletar dados essenciais
        run: bash data/scripts/fetch_essentials.sh

      - name: Resumo
        if: always()
        run: gcloud storage ls -r "gs://$BUCKET/raw/" | tail -40 || true
